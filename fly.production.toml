# fly.toml file for Sakura 3 Community Identity Portal (Production)

app = "portal-sakura3"
primary_region = "sin" # Singapore (closest region to UTC+7)

[build]
  # Uses the local Dockerfile we created
  dockerfile = "Dockerfile"
  [build.args]
    VITE_SUPABASE_URL = "https://cycloiewvrajoeosahtd.supabase.co"
    VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_31n0z182NnueTrYzppqW_w_gBf-vN8p"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256 # Cost-efficient static nginx hosting
