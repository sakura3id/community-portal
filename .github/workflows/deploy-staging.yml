name: Deploy to Staging

on:
  push:
    tags:
      - 'staging-*'    # e.g. staging-2026-07-30
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io (Staging)
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git describe (version tags)

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        run: |
          flyctl deploy \
            --build-arg VITE_GIT_SHA=${{ github.sha }} \
            --build-arg VITE_GIT_BRANCH=${{ github.ref_name }} \
            --build-arg VITE_APP_VERSION=${{ github.ref_name }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
