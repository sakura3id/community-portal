# fly.toml file for Veryresto Community Identity Portal (Staging)

app = "community-veryresto"
primary_region = "sin" # Singapore (closest region to UTC+7)

[build]
  # Uses the local Dockerfile we created
  dockerfile = "Dockerfile"
  [build.args]
    VITE_SUPABASE_URL = "https://zhpwhoiigwwgpxvsubdb.supabase.co"
    VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8gdVtK4TbhQu6nR5AJQlsw_-cFWTLvF"
    # Add staging URLs here:
    VITE_IPL_FINDER_URL = "https://ipl-finder.sr3.my.id"
    VITE_REKAP_VIEWER_URL = "https://rekap.sr3.my.id"
    VITE_COMMUNITY_DOCS_URL = "https://info.sr3.my.id"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256 # Cost-efficient static nginx hosting
